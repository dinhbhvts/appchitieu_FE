<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VibeApp — Xem trước giao diện</title>
<!--
  BAN XEM TRUOC GIAO DIEN (chay trong trinh duyet).
  File nay KHONG phai app that (app that la Flutter), no chi giup ban NHIN va
  DUNG THU giao dien ngay tren Chrome, dung chung backend dang chay o
  http://127.0.0.1:8000. Mo file bang cach nhay doi chuot.
-->
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --line:#e3e7eb; --text:#1f2933;
    --muted:#6b7280; --accent:#185FA5; --accent-bg:#E6F1FB;
    --green:#0F6E56; --green-bg:#E1F5EE; --red:#A32D2D; --red-bg:#FCEBEB;
  }
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{margin:0;background:var(--bg);color:var(--text);}
  /* Khung dien thoai o giua man hinh */
  /* App shell: trang cuon binh thuong (body), thanh tab + nut hanh dong duoc
     ghim CO DINH (position:fixed) o day man hinh - cach on dinh nhat tren
     trinh duyet dien thoai. padding-bottom chua cho khong bi che. */
  .phone{max-width:460px;margin:0 auto;background:var(--bg);min-height:100dvh;
    box-shadow:0 0 24px rgba(0,0,0,.06);padding-bottom:calc(132px + env(safe-area-inset-bottom));}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;}
  .apptitle{font-size:18px;font-weight:600;}
  .server{font-size:11px;color:var(--muted);margin-top:2px;}
  .server input{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;width:200px;}
  .monthbar{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px;background:var(--card);border-bottom:1px solid var(--line);}
  .monthbar button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--accent);}
  .content{padding:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .bignum{font-size:26px;font-weight:600;}
  .sub{font-size:12px;color:var(--muted);}
  .stat{border-radius:10px;padding:10px;flex:1;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .tx{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);}
  .tx:last-child{border-bottom:none;}
  .tx .desc{font-size:14px;} .tx .meta{font-size:11px;color:var(--muted);}
  .inc{color:var(--green);font-weight:600;} .exp{color:var(--red);font-weight:600;}
  .editbtn{color:var(--accent);cursor:pointer;font-size:15px;padding:2px 4px;}
  /* Thanh tab GHIM CO DINH o day man hinh (canh giua tren desktop). */
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;
    display:flex;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);z-index:20;}
  .tabs button{flex:1;border:none;background:none;padding:10px 0;font-size:12px;color:var(--muted);cursor:pointer;}
  .tabs button.active{color:var(--accent);font-weight:600;}
  .tabs .ico{font-size:20px;display:block;}
  /* Thanh nut hanh dong, ghim ngay tren thanh tab, luon trong tam voi. */
  .actionbar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:460px;
    bottom:calc(56px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 14px;z-index:19;
    background:linear-gradient(to top, var(--bg) 70%, rgba(244,246,248,0));box-sizing:border-box;}
  .actionbar:empty{display:none;}
  .abtn{flex:1;background:var(--accent);color:#fff;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;}
  .abtn.alt{background:var(--green);}
  .seg{display:flex;gap:8px;margin-bottom:12px;}
  .seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;}
  .seg button.exp-on{background:var(--red-bg);color:var(--red);border-color:var(--red-bg);font-weight:600;}
  .seg button.inc-on{background:var(--green-bg);color:var(--green);border-color:var(--green-bg);font-weight:600;}
  input,select{font-size:15px;padding:9px;border:1px solid var(--line);border-radius:8px;width:100%;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;}
  .chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-bg);}
  .primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;width:100%;font-size:15px;font-weight:600;cursor:pointer;}
  .ghost{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10;}
  .modal.on{display:flex;}
  .sheet{background:#fff;width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;}
  .err{color:var(--red);font-size:13px;padding:10px;background:var(--red-bg);border-radius:8px;}
  .login-overlay{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .login-overlay.on{display:flex;}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:340px;}
  .logout{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;}
  h3{font-size:15px;margin:6px 0 10px;}
  .sectitle{font-size:12px;color:var(--muted);margin:14px 0 6px;}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="apptitle">VibeApp — quản lý thu chi</div>
      <div style="text-align:right"><span class="sub" id="whoami"></span><br><span class="logout" onclick="logout()">Đăng xuất</span></div>
    </div>
    <div class="server">Máy chủ: <input id="server" value="https://appchitieu.onrender.com" /></div>
  </header>

  <div class="monthbar">
    <button onclick="changeMonth(-1)">‹</button>
    <select id="monthSel" onchange="jumpYM()" style="margin:0;width:auto;display:inline-block"></select>
    <select id="yearSel" onchange="jumpYM()" style="margin:0;width:auto;display:inline-block"></select>
    <button onclick="changeMonth(1)">›</button>
  </div>

  <div class="content" id="content">Đang tải…</div>

  <div class="actionbar" id="actionbar"></div>

  <div class="tabs">
    <button id="tab-thuchi" class="active" onclick="go('thuchi')"><span class="ico">☰</span>Thu chi</button>
    <button id="tab-chungkhoan" onclick="go('chungkhoan')"><span class="ico">↗</span>Chứng khoán</button>
    <button id="tab-taisan" onclick="go('taisan')"><span class="ico">◆</span>Tài sản</button>
    <button id="tab-baocao" onclick="go('baocao')"><span class="ico">▤</span>Báo cáo</button>
  </div>
</div>

<!-- Form nhap giao dich -->
<div class="modal" id="txModal">
  <div class="sheet">
    <h3>Thêm giao dịch</h3>
    <div class="seg">
      <button id="btnChi" class="exp-on" onclick="setType('expense')">Chi</button>
      <button id="btnThu" onclick="setType('income')">Thu</button>
      <button id="btnChuyen" onclick="setType('transfer')">Chuyển</button>
    </div>
    <div id="txTransferHint" class="sub" style="display:none;margin-bottom:10px">Chồng chuyển cho vợ (không tính vào tổng thu/chi, chỉ dịch chuyển trong quỹ).</div>
    <input id="txAmount" type="number" placeholder="Số tiền" />
    <input id="txContent" placeholder="Nội dung (vd: đi chợ)" />
    <div class="chips" id="txChips"></div>
    <select id="txUser"></select>
    <input id="txDate" type="date" />
    <input id="txNote" placeholder="Ghi chú (không bắt buộc)" />
    <div id="txErr"></div>
    <button id="txDelBtn" onclick="deleteTx()" style="display:none;width:100%;background:var(--red-bg);color:var(--red);border:none;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:14px">Xóa giao dịch này</button>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="ghost" style="flex:1" onclick="closeTx()">Hủy</button>
      <button class="primary" style="flex:2" onclick="saveTx()">Lưu giao dịch</button>
    </div>
  </div>
</div>

<!-- Man dang nhap -->
<div class="login-overlay" id="login">
  <div class="login-card">
    <div class="apptitle" style="text-align:center">VibeApp</div>
    <div class="sub" style="text-align:center;margin-bottom:16px">Đăng nhập để tiếp tục</div>
    <label class="sub">Người dùng</label>
    <select id="loginUser"></select>
    <label class="sub">Mật khẩu</label>
    <input id="loginPass" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter')doLogin()" />
    <div id="loginErr"></div>
    <button class="abtn" style="width:100%" onclick="doLogin()">Đăng nhập</button>
    <div class="server" style="margin-top:14px">Máy chủ: <input id="loginServer" oninput="document.getElementById('server').value=this.value" /></div>
  </div>
</div>

<!-- Form nap/rut chung khoan -->
<div class="modal" id="cfModal">
  <div class="sheet">
    <h3>Nạp / Rút tài khoản chứng khoán</h3>
    <div class="seg">
      <button id="btnNap" class="inc-on" onclick="setCf('deposit')">Nạp</button>
      <button id="btnRut" onclick="setCf('withdraw')">Rút</button>
    </div>
    <input id="cfAmount" type="number" placeholder="Số tiền" />
    <input id="cfDate" type="date" />
    <select id="cfUser"></select>
    <input id="cfNote" placeholder="Ghi chú (không bắt buộc)" />
    <div id="cfErr"></div>
    <button id="cfDelBtn" onclick="deleteCf()" style="display:none;width:100%;background:var(--red-bg);color:var(--red);border:none;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:14px">Xóa khoản này</button>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="ghost" style="flex:1" onclick="closeCf()">Hủy</button>
      <button class="primary" style="flex:2" onclick="saveCf()">Lưu</button>
    </div>
  </div>
</div>

<!-- Form mua/ban chung khoan -->
<div class="modal" id="trModal">
  <div class="sheet">
    <h3>Lệnh mua / bán chứng khoán</h3>
    <div class="seg">
      <button id="btnMua" class="inc-on" onclick="setTr('buy')">Mua</button>
      <button id="btnBan" onclick="setTr('sell')">Bán</button>
    </div>
    <input id="trSymbol" placeholder="Mã CK (vd: NKG)" />
    <input id="trQty" type="number" placeholder="Khối lượng (số cổ phiếu)" oninput="calcTrPrice()" />
    <input id="trTotal" type="number" placeholder="Tổng số tiền" oninput="calcTrPrice()" />
    <div class="sub" id="trUnit" style="margin:-4px 0 10px"></div>
    <input id="trFee" type="number" placeholder="Phí giao dịch (không bắt buộc)" />
    <input id="trDate" type="date" />
    <select id="trUser"></select>
    <div id="trErr"></div>
    <button id="trDelBtn" onclick="deleteTr()" style="display:none;width:100%;background:var(--red-bg);color:var(--red);border:none;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:14px">Xóa lệnh này</button>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="ghost" style="flex:1" onclick="closeTr()">Hủy</button>
      <button class="primary" style="flex:2" onclick="saveTr()">Lưu lệnh</button>
    </div>
  </div>
</div>

<!-- Form danh muc dang giu (nhap tay) -->
<div class="modal" id="hdModal">
  <div class="sheet">
    <h3>Khoản đang giữ</h3>
    <input id="hdSymbol" placeholder="Mã CK / tên (vd: NKG)" />
    <input id="hdValue" type="number" placeholder="Giá trị hiện tại (số tiền)" />
    <input id="hdNote" placeholder="Ghi chú (không bắt buộc)" />
    <div id="hdErr"></div>
    <button id="hdDelBtn" onclick="deleteHd()" style="display:none;width:100%;background:var(--red-bg);color:var(--red);border:none;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:14px">Xóa khoản này</button>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="ghost" style="flex:1" onclick="closeHd()">Hủy</button>
      <button class="primary" style="flex:2" onclick="saveHd()">Lưu</button>
    </div>
  </div>
</div>

<!-- Form them tai san -->
<div class="modal" id="asModal">
  <div class="sheet">
    <h3>Thêm tài sản</h3>
    <input id="asName" placeholder="Tên (vd: TK vợ)" />
    <input id="asValue" type="number" placeholder="Giá trị" />
    <input id="asNote" placeholder="Ghi chú (vd: 1 cây)" />
    <div id="asErr"></div>
    <button id="asDelBtn" onclick="deleteAs()" style="display:none;width:100%;background:var(--red-bg);color:var(--red);border:none;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:14px">Xóa khoản này</button>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="ghost" style="flex:1" onclick="closeAs()">Hủy</button>
      <button class="primary" style="flex:2" onclick="saveAs()">Lưu</button>
    </div>
  </div>
</div>

<script>
// ---- Trang thai chung ----
let tab = "thuchi";
let now = new Date();
let year = now.getFullYear(), month = now.getMonth() + 1; // 1..12
let users = [], categories = [], txType = "expense", chosenCat = null;
// Bao cao: khoang thoi gian tuy chon. null = dung thang dang chon.
let reportStart = null, reportEnd = null;

// ---- Dang nhap ----
let token = localStorage.getItem("vibeapp_token") || "";
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem("vibeapp_user") || "null"); } catch(e){}

const api = () => document.getElementById("server").value.replace(/\/$/, "");
const vnd = n => Math.round(n).toLocaleString("vi-VN");
const pad = n => String(n).padStart(2, "0");
const startDate = () => `${year}-${pad(month)}-01`;
const endDate = () => { const d = new Date(year, month, 0); return `${year}-${pad(month)}-${pad(d.getDate())}`; };

// Gan token vao moi yeu cau; neu server tra 401 (het han) thi bat dang nhap lai.
function authHeaders(extra){ const h = Object.assign({}, extra||{}); if(token) h["Authorization"]="Bearer "+token; return h; }
async function handleResp(r){
  if(r.status===401){ logout(); throw new Error("Phiên đăng nhập đã hết hạn, mời đăng nhập lại."); }
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function jget(path){ return handleResp(await fetch(api()+path, {headers: authHeaders()})); }
async function jpost(path, body){ return handleResp(await fetch(api()+path,{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:body?JSON.stringify(body):null})); }
async function jput(path, body){ return handleResp(await fetch(api()+path,{method:"PUT",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify(body)})); }
async function jdelete(path){ return handleResp(await fetch(api()+path,{method:"DELETE",headers:authHeaders()})); }

// ---- Dang nhap / dang xuat ----
function showLogin(){
  document.getElementById("login").classList.add("on");
  document.getElementById("loginServer").value = document.getElementById("server").value;
  loadLoginUsers();
}
function hideLogin(){ document.getElementById("login").classList.remove("on"); }
async function loadLoginUsers(){
  try{
    const us = await (await fetch(api()+"/users")).json();
    document.getElementById("loginUser").innerHTML = us.map(u=>`<option value="${u.name}">${u.name}</option>`).join("");
  }catch(e){ document.getElementById("loginErr").innerHTML=`<div class="err">Không kết nối được máy chủ. Kiểm tra địa chỉ.</div>`; }
}
async function doLogin(){
  const username = document.getElementById("loginUser").value;
  const password = document.getElementById("loginPass").value;
  document.getElementById("loginErr").innerHTML = "";
  try{
    const r = await fetch(api()+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
    if(!r.ok){ document.getElementById("loginErr").innerHTML=`<div class="err">Sai tên đăng nhập hoặc mật khẩu.</div>`; return; }
    const data = await r.json();
    token = data.access_token; currentUser = data.user;
    localStorage.setItem("vibeapp_token", token);
    localStorage.setItem("vibeapp_user", JSON.stringify(currentUser));
    document.getElementById("loginPass").value = "";
    hideLogin(); startApp();
  }catch(e){ document.getElementById("loginErr").innerHTML=`<div class="err">${e.message}</div>`; }
}
function logout(){
  token=""; currentUser=null;
  localStorage.removeItem("vibeapp_token"); localStorage.removeItem("vibeapp_user");
  users=[]; categories=[];
  showLogin();
}

function go(t){ tab=t; for(const x of ["thuchi","chungkhoan","taisan","baocao"]) document.getElementById("tab-"+x).classList.toggle("active", x===t); render(); }
function changeMonth(delta){ month+=delta; if(month<1){month=12;year--;} if(month>12){month=1;year++;} reportStart=reportEnd=null; render(); }

async function ensureRef(){
  if(users.length===0){ try{ users = await jget("/users"); }catch(e){} }
  if(categories.length===0){ try{ categories = await jget("/categories"); }catch(e){} }
}

function syncYM(){
  const ys = document.getElementById("yearSel");
  const ms = document.getElementById("monthSel");
  const nowY = new Date().getFullYear();
  if(ys.options.length===0){
    // Nam tu 2022 den nam hien tai + 1
    let opts = "";
    for(let y=2022; y<=nowY+1; y++) opts += `<option value="${y}">${y}</option>`;
    ys.innerHTML = opts;
    ms.innerHTML = Array.from({length:12},(_,i)=>`<option value="${i+1}">Tháng ${i+1}</option>`).join("");
  }
  ys.value = year; ms.value = month;
}
function jumpYM(){ year=parseInt(document.getElementById("yearSel").value); month=parseInt(document.getElementById("monthSel").value); reportStart=reportEnd=null; render(); }

function setActionBar(){
  const ab = document.getElementById("actionbar");
  if(tab==="thuchi") ab.innerHTML = `<button class="abtn" onclick="openTx()">+ Thêm giao dịch</button>`;
  else if(tab==="taisan") ab.innerHTML = `<button class="abtn" onclick="openAs()">+ Thêm tài sản</button>`;
  else if(tab==="chungkhoan"){
    // Tab Tổng chỉ xem; tab Chồng/Vợ mới cho thêm/sửa.
    if(stockUser===null) ab.innerHTML = "";
    else ab.innerHTML = `<button class="abtn alt" onclick="openCf()">Nạp/Rút</button><button class="abtn" onclick="openTr()">Mua/Bán</button><button class="abtn" style="background:var(--muted)" onclick="openHd()">Đang giữ</button>`;
  }
  else ab.innerHTML = "";
}

async function render(){
  syncYM();
  setActionBar();
  document.getElementById("whoami").textContent = currentUser ? currentUser.name : "";
  const c = document.getElementById("content");
  c.innerHTML = "Đang tải…";
  await ensureRef();
  try{
    if(tab==="thuchi") await renderThuChi(c);
    else if(tab==="chungkhoan") await renderChungKhoan(c);
    else if(tab==="taisan") await renderTaiSan(c);
    else await renderBaoCao(c);
  }catch(e){
    c.innerHTML = `<div class="err">Không kết nối được máy chủ.<br>Hãy chắc chắn backend đang chạy (uvicorn) tại địa chỉ ở trên.<br><br>${e.message}</div>`;
  }
}

// ---- Tab Thu chi ----
let monthTxs = [];   // luu giao dich thang hien tai de bam sua
async function renderThuChi(c){
  const s = await jget(`/reports/summary?start=${startDate()}&end=${endDate()}`);
  const txs = await jget(`/transactions?start=${startDate()}&end=${endDate()}`);
  monthTxs = txs;
  let html = `<div class="card">
    <div class="bignum">${vnd(s.balance)} đ</div>
    <div class="sub">Số dư tháng này</div>
    <div class="row" style="gap:10px;margin-top:12px;">
      <div class="stat" style="background:var(--green-bg)"><div class="sub" style="color:var(--green)">Thu</div><div style="color:var(--green);font-weight:600">${vnd(s.total_income)}</div></div>
      <div class="stat" style="background:var(--red-bg)"><div class="sub" style="color:var(--red)">Chi</div><div style="color:var(--red);font-weight:600">${vnd(s.total_expense)}</div></div>
    </div></div>`;
  html += `<div class="card">`;
  if(txs.length===0){ html += `<div class="sub">Chưa có giao dịch trong tháng</div>`; }
  else{
    for(const t of txs.slice().reverse()){
      // Bam vao dong de sua giao dich (khi nhap nham).
      const edit = `<span class="editbtn" onclick="editTx(${t.id})" title="Sửa">✎</span>`;
      if(t.type==="transfer"){
        html += `<div class="tx"><div><div class="desc">${t.content}</div><div class="meta">${fmtDate(t.date)} · chuyển nội bộ</div></div>
          <div style="display:flex;align-items:center;gap:10px"><span style="color:var(--muted)">→ ${vnd(t.amount)}</span>${edit}</div></div>`;
      }else{
        const inc = t.type==="income";
        html += `<div class="tx"><div><div class="desc">${t.content}</div><div class="meta">${fmtDate(t.date)}</div></div>
          <div style="display:flex;align-items:center;gap:10px"><span class="${inc?'inc':'exp'}">${inc?'+':'-'}${vnd(t.amount)}</span>${edit}</div></div>`;
      }
    }
  }
  html += `</div>`;
  c.innerHTML = html;
}

async function renderChungKhoan(c){

  const s = await jget(`/stocks/summary${q}`);

  // Sub-tabs Tong / Chong / Vo
  const tabBtn = (label,val)=>`<button class="chip ${stockUser===val?'on':''}" onclick="setStockUser(${val===null?'null':val})">${label}</button>`;
  let html = `<div class="chips" style="margin-bottom:12px">
    ${tabBtn("Tổng", null)}${tabBtn("Chồng", chId)}${tabBtn("Vợ", voId)}</div>`;

  html += `<div class="card">
    <div class="row" style="gap:10px;flex-wrap:wrap">
      ${miniStat("Tổng đã nạp", s.total_deposit, "var(--muted)")}
      ${miniStat("Tổng đã rút", s.total_withdraw, "var(--muted)")}
    </div>

      ${miniStat("Vốn đang đầu tư", s.invested_capital, "var(--accent)")}
      ${miniStat("Lãi/lỗ đã chốt", s.total_realised_pl, s.total_realised_pl>=0?"var(--green)":"var(--red)")}
    </div></div>`;

  // Danh muc dang giu - NHAP TAY (khong tinh tu giao dich), uu tien so tien.
  html += `<div class="sectitle">Danh mục đang giữ</div><div class="card">`;
  if(stockHoldings.length===0){
    html += `<div class="sub">Chưa nhập khoản đang giữ nào${canEdit?'. Bấm nút "Đang giữ" ở dưới để thêm.':''}</div>`;
  }else{
    let tot=0;
    for(const hd of stockHoldings){ tot+=Number(hd.value);
      const edit = canEdit ? `<span class="editbtn" onclick="editHd(${hd.id})" title="Sửa">✎</span>` : '';
      html += `<div class="tx"><div><div class="desc">${hd.symbol}</div>${hd.note?`<div class="meta">${hd.note}</div>`:''}</div>
        <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:600">${vnd(hd.value)}</span>${edit}</div></div>`;
    }
    html += `<div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><span class="sub">Tổng đang giữ</span><span style="font-weight:600">${vnd(tot)} đ</span></div>`;
  }
  html += `</div>`;

  // Nap/rut gan day
  if(stockCashflows.length){
    html += `<div class="sectitle">Nạp / rút gần đây</div><div class="card">`;
    for(const cf of stockCashflows.slice(-10).reverse()){
      const dep = cf.type==="deposit";
      const edit = canEdit ? `<span class="editbtn" onclick="editCf(${cf.id})" title="Sửa">✎</span>` : '';
      html += `<div class="tx"><div><div class="desc">${dep?'Nạp':'Rút'}${cf.note?' · '+cf.note:''}</div><div class="meta">${fmtDate(cf.date)}</div></div>
        <div style="display:flex;align-items:center;gap:10px"><span class="${dep?'inc':'exp'}">${dep?'+':'-'}${vnd(cf.amount)}</span>${edit}</div></div>`;
    }
    html += `</div>`;
  }

  // Lenh mua/ban gan day - uu tien hien so tien (tong = KL * don gia).
  if(stockTrades.length){
    html += `<div class="sectitle">Lệnh mua / bán gần đây</div><div class="card">`;
    for(const t of stockTrades.slice(-12).reverse()){
      const buy = t.side==="buy";
      const total = t.quantity * t.price;
      const edit = canEdit ? `<span class="editbtn" onclick="editTr(${t.id})" title="Sửa">✎</span>` : '';
      html += `<div class="tx"><div><div class="desc">${t.symbol} · ${buy?'Mua':'Bán'} ${t.quantity} cp</div>
        <div class="meta">${fmtDate(t.date)} · đơn giá ${vnd(t.price)}${t.fee?` · phí ${vnd(t.fee)}`:''}</div></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="font-weight:600;color:${buy?'var(--red)':'var(--green)'}">${vnd(total)}</span>${edit}</div></div>`;
    }
    html += `</div>`;
  }

  c.innerHTML = html;
}

async function renderBaoCao(c){

  let html = `<div class="card"><div class="sectitle" style="margin-top:0">Khoảng thời gian</div>

  html += `<div class="card"><div class="sectitle" style="margin-top:0">Theo từng người</div>`;
  for(const u of users){

    if(su.transferred_out>0) block += rowLine("Chuyển cho vợ", su.transferred_out, "var(--muted)");
    if(su.transferred_in>0) block += rowLine("Chồng chuyển", su.transferred_in, "var(--green)");
    block += rowLine("Còn giữ (sau chuyển)", su.net_held, "var(--accent)");
    block += `</div>`;
    html += block;
  }
  html += `</div>`;

  html += `</div>`;
  c.innerHTML = html;
}

}
async function deleteAs(){ if(!editingAsId) return; if(!confirm("Xóa khoản tài sản này?")) return;
  try{ await jdelete("/assets/"+editingAsId); closeAs(); render(); }catch(e){ document.getElementById("asErr").innerHTML=`<div class="err">${e.message}</div>`; } }
async function copyPrev(){ try{ await jpost(`/assets/copy-previous?year=${year}&month=${month}`); render(); }catch(e){ alert(e.message); } }

// ---- Khoi dong ----
function startApp(){ render(); }

async function boot(){
  // Chua co token -> bat dang nhap.
  if(!token){ showLogin(); return; }
  // Co token -> kiem tra con han khong bang /auth/me.
  try{
    const r = await fetch(api()+"/auth/me", {headers: authHeaders()});
    if(r.status===200){ currentUser = await r.json(); startApp(); }
    else { logout(); }
  }catch(e){
    // Khong goi duoc may chu: van cho vao man dang nhap de doi dia chi.
    showLogin();
  }
}
boot();
</script>
